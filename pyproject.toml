[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-daily-review-agent"
version = "0.7.1"
description = "Local-first, read-only Codex daily reviews with evidence and optional approved Notion sync"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
daily-review = "daily_review.cli:main"

[project.urls]
Homepage = "https://github.com/Miladly/codex-daily-review-agent"
Issues = "https://github.com/Miladly/codex-daily-review-agent/issues"

[tool.setuptools.packages.find]
include = ["daily_review*"]

[tool.setuptools.package-data]
daily_review = ["skills/evidence-daily-review/SKILL.md", "skills/evidence-daily-review/references/quality.md"]
