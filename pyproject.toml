[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-daily-review-agent"
version = "0.3.0"
description = "Local-first, read-only Codex daily reviews with evidence and optional approved Notion sync"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
daily-review = "daily_review.cli:main"

[tool.setuptools.packages.find]
include = ["daily_review*"]
