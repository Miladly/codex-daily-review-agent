name: Offline tests and release privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_release.py --history
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/smoke_install.py --wheel dist/local_daily_review_agent-0.5.0-py3-none-any.whl
